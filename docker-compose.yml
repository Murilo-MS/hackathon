cat << 'EOF' > ~/hackathon/docker-compose.yml
services:
  db:
    image: postgres:16-alpine
    container_name: hackathon_db
    restart: always
    environment:
      POSTGRES_USER: hackathon_user
      POSTGRES_PASSWORD: hackathon_password
      POSTGRES_DB: leilao_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dados:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon_user -d leilao_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hackathon_backend
    restart: always
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-segredo-de-teste-troque-no-arquivo-env}
      JWT_EXPIRES_IN: 1h
      DATABASE_URL: postgresql://hackathon_user:hackathon_password@db:5432/leilao_db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
EOF