# Sobe o sistema completo: PostgreSQL + API Node (que também serve a tela).
# A porta publicada é a 8080, que é a exigida na avaliação.
#
# Uso: docker compose up -d --build
#      curl http://localhost:8080/health

services:
  db:
    image: postgres:16-alpine
    container_name: hackathon_db
    restart: always
    environment:
      POSTGRES_USER: hackathon_user
      POSTGRES_PASSWORD: hackathon_password
      POSTGRES_DB: leilao_db
    ports:
      # 127.0.0.1 na frente = só a própria VM alcança o banco.
      # Sem isso o PostgreSQL ficaria exposto na internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Na PRIMEIRA subida (volume vazio), o Postgres executa os .sql desta pasta
      # em ordem alfabética: leilao_db.sql (schema) e depois seed.sql (dados demo).
      # Com volume já criado isso é ignorado; nesse caso use: npm run db:setup
      - ./dados:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon_user -d leilao_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      # Contexto na raiz: a imagem precisa de backend/, front/public e dados/
      context: .
      dockerfile: backend/Dockerfile
    container_name: hackathon_backend
    restart: always
    environment:
      PORT: 8080
      # O Docker Compose lê a variável JWT_SECRET do arquivo .env na raiz.
      # Se ele não existir, cai no valor padrão abaixo, que serve só para teste.
      JWT_SECRET: ${JWT_SECRET:-segredo-de-teste-troque-no-arquivo-env}
      JWT_EXPIRES_IN: 1h
      DATABASE_URL: postgresql://hackathon_user:hackathon_password@db:5432/leilao_db
      # Fotos: com S3_* configurado, vão para o bucket. Sem S3, ficam nesta pasta.
      UPLOADS_DIR: /app/uploads
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      # Mantém as fotos entre rebuilds; no modo S3 isso não é usado
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
